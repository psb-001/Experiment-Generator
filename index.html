<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Generator</title>
    <meta name="description" content="Generate complete C programming experiment reports as PDF — instant download, no signup required.">

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type"        content="website">
    <meta property="og:url"         content="https://psb-001.github.io/">
    <meta property="og:title"       content="Experiment Generator">
    <meta property="og:description" content="Generate complete C programming experiment reports as PDF — instant download, no signup required.">
    <meta property="og:image"       content="https://psb-001.github.io/header.png">

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Experiment Generator">
    <meta name="twitter:description" content="Generate complete C programming experiment reports as PDF — instant download, no signup required.">
    <meta name="twitter:image"       content="https://psb-001.github.io/header.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%23da291c'/><text x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>E</text></svg>">
    <script data-goatcounter="https://psb.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'canvas': '#181818',
                        'canvas-elevated': '#303030',
                        'rosso': '#da291c',
                        'rosso-active': '#b01e0a',
                        'hypersail': '#fff200',
                    },
                    fontFamily: {
                        'sans': ['-apple-system', 'system-ui', 'sans-serif'],
                    },
                    letterSpacing: {
                        'button': '1.4px',
                        'nav': '0.65px',
                        'caption': '1.1px',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-canvas text-white font-sans flex flex-col min-h-screen">
    <div class="flex-1 flex items-center justify-center px-6 py-8">
        <div class="w-full max-w-2xl">
            <h1 class="text-3xl md:text-4xl font-medium tracking-tight text-center mb-4 text-white">
                Experiment Generator
            </h1>
            <p class="text-base text-gray-400 text-center mb-16 font-normal">
                Generate complete experiment reports in PDF format
            </p>
            
            <form id="experimentForm" class="space-y-6">
                <div class="space-y-2">
                    <label for="studentName" class="block text-xs font-semibold uppercase tracking-caption text-white">
                        Student Name
                    </label>
                    <input 
                        type="text" 
                        id="studentName" 
                        name="studentName" 
                        required
                        class="w-full px-4 py-3 bg-canvas border border-canvas-elevated rounded-sm text-white text-base h-12 focus:outline-none focus:border-hypersail transition-colors"
                        placeholder="Enter your full name"
                    >
                </div>
                
                <div class="space-y-2">
                    <label for="branch" class="block text-xs font-semibold uppercase tracking-caption text-white">
                        Branch
                    </label>
                    <select 
                        id="branch" 
                        name="branch" 
                        required
                        class="w-full px-4 py-3 bg-canvas border border-canvas-elevated rounded-sm text-white text-base h-12 focus:outline-none focus:border-hypersail transition-colors cursor-pointer"
                    >
                        <option value="" class="bg-canvas">Select Branch</option>
                        <option value="computer-engineering" class="bg-canvas">Computer Engineering</option>
                        <option value="ai-ml" class="bg-canvas">AI/ML</option>
                        <option value="it" class="bg-canvas">IT</option>
                        <option value="entc" class="bg-canvas">ENTC</option>
                    </select>
                </div>
                
                <div class="space-y-2">
                    <label for="rollNumber" class="block text-xs font-semibold uppercase tracking-caption text-white">
                        Roll Number
                    </label>
                    <input 
                        type="text" 
                        id="rollNumber" 
                        name="rollNumber" 
                        required
                        class="w-full px-4 py-3 bg-canvas border border-canvas-elevated rounded-sm text-white text-base h-12 focus:outline-none focus:border-hypersail transition-colors"
                        placeholder="Enter your roll number"
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="w-full bg-rosso hover:bg-rosso-active active:bg-rosso-active disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold uppercase tracking-button h-12 rounded-none transition-colors mt-6 relative overflow-hidden"
                >
                    <span id="btnText">Generate Experiment PDF</span>
                    <span id="progressBar" class="absolute bottom-0 left-0 h-0.5 bg-hypersail w-0 transition-none"></span>
                </button>
            </form>
        </div>
    </div>

    <footer class="border-t border-canvas-elevated bg-canvas/95 backdrop-blur-sm w-full">
        <!-- Red accent line -->
        <div class="h-px w-full bg-gradient-to-r from-transparent via-rosso to-transparent opacity-60"></div>

        <div class="max-w-2xl mx-auto px-6 py-3 flex items-center justify-between gap-4">

            <!-- Left: social icons -->
            <div class="flex items-center gap-4">
                <a href="https://github.com/psb-001" target="_blank" aria-label="GitHub"
                   class="footer-social-link text-gray-600 transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </a>
                <a href="https://www.instagram.com/pratham01012007/" target="_blank" aria-label="Instagram"
                   class="footer-social-link text-gray-600 transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </a>
            </div>

            <!-- Center: tagline — visible on all sizes -->
            <p class="text-gray-600 text-xs font-medium tracking-widest uppercase text-center flex-1">C Programming</p>

            <!-- Right: large bold initials -->
            <a href="https://www.instagram.com/pratham01012007" target="_blank" class="footer-psb-link no-underline flex items-center gap-1.5">
                <span class="footer-psb-by text-gray-700 text-xs uppercase tracking-button font-semibold transition-colors">by</span>
                <span class="footer-psb-text text-xl font-black uppercase tracking-tight text-white transition-colors leading-none">PSB</span>
            </a>

        </div>
    </footer>
    
    <script src="src/js/script.js"></script>

    <!-- Toast notification -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 flex items-center gap-3 px-5 py-3 bg-canvas-elevated border border-canvas-elevated rounded-sm text-white text-sm font-medium opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-hypersail shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 00-1.414 0L8 12.586 4.707 9.293a1 1 0 00-1.414 1.414l4 4a1 1 0 001.414 0l8-8a1 1 0 000-1.414z" clip-rule="evenodd"/>
        </svg>
        <span id="toastMessage">PDF generated successfully</span>
    </div>
</body>
</html>
